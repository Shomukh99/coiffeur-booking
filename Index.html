<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لمسة جمال - حجز كوافير</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>💇‍♀️ لمسة جمال</h1>
    <p>احجزي موعدك بسهولة</p>
</header>

<section class="services">
    <h2>خدماتنا</h2>
    <div class="cards">
        <div class="card">قص شعر - 5000ج</div>
        <div class="card">صبغة - 15000ج</div>
        <div class="card">مكياج - 10000ج</div>
        <div class="card">حمام زيت - 7000ج</div>
    </div>
</section>

<section class="booking">
    <h2>احجزي الآن</h2>
    <form id="bookingForm">
        <input type="text" id="name" placeholder="اسمك" required>
        <input type="tel" id="phone" placeholder="رقم التلفون" required>
        
        <select id="service" required>
            <option value="">اختاري الخدمة</option>
            <option>قص شعر</option>
            <option>صبغة</option>
            <option>مكياج</option>
            <option>حمام زيت</option>
        </select>

        <input type="date" id="date" required>
        <input type="time" id="time" required>
        
        <button type="submit">تأكيد الحجز</button>
    </form>
</section>

<section class="list">
    <h2>حجوزاتي</h2>
    <div id="bookingList"></div>
</section>

<script src="script.js"></script>
</body>
</html>
